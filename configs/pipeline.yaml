# TOOFAN Pipeline Configuration
# Main pipeline configuration file

# Data source paths
data:
  ibtracs_path: "wind/ibtracs.NI.list.v04r01.csv"
  imd_path: "cyclone intensity/data/raw/IMD_best_track.xlsx"
  era5_dir: "cyclone_backup/ERA5_expanded"
  era5_extracted_features: "cyclone_backup/models/RI_ERA5_features_MVP.csv"
  satellite_dir: "cyclone_backup/satellite_cnn_recovered/images"
  satellite_metadata: "cyclone_backup/satellite_cnn_recovered/metadata_clean.csv"
  imerg_dir: "rain/data"
  dem_path: "flood/data/dem.tif"
  dem_derived_dir: "flood/data/derived"
  soil_dir: "flood/data/soil"
  landcover_path: "flood/data/landcover.tif"
  hydro_dir: "flood/data/hydrology"
  tide_surge_dir: "flood/data/tide_surge"

# Model configurations
models:
  genesis:
    name: "genesis"
    version: "1.0.0"
    enabled: true
    mode: production

    production_model: lightgbm

    artifacts:
      lightgbm: "genisis models/tc_genesis_lightgbm_300_OPTIMIZED.joblib"
      xgboost: "genisis models/tc_genesis_xgboost_300_OPTIMIZED.joblib"
      randomforest: "genisis models/tc_genesis_randomforest_300_OPTIMIZED.joblib"
      imputer: "genisis models/tc_genesis_300_imputer.joblib"

    ensemble:
      enabled: true
      models:
        lightgbm: 0.40
        xgboost: 0.35
        randomforest: 0.25

    threshold: 0.24
    target: genesis_24h
    n_features: 34
    candidate_latitude: null
    candidate_longitude: null

  trajectory:
    name: "trajectory"
    version: "lt3p"
    checkpoint: "best_cyclone_model_lt3p_distilled.pth"
    scalers: "scalers.pkl"

  intensity:
    name: "intensity"
    version: "latest"
    checkpoint: "cyclone intensity/models/final_xgb_regressor.joblib"

  ri:
    name: "ri"
    version: "latest"
    checkpoint: "cyclone_backup/models/imd_final_xgboost.json"
    era5_checkpoint: "cyclone_backup/models/era5_final_xgboost.json"
    satellite_checkpoint: "cyclone_backup/models/satellite_cnn.pt"
    fusion_checkpoint: "cyclone_backup/models/imd_era5_final_xgboost.json"

  rainfall:
    name: "rainfall"
    version: "baseline"
    checkpoint: "rain/model/rainfall_classifier_12.pkl"

  wind:
    name: "wind"
    version: "baseline"
    checkpoint: "wind/model/wind_model_best.keras"

  flood:
    name: "flood"
    version: "baseline"
    checkpoint: "flood/model/flood_xgboost_spatial_holdout.pkl"

  landslide:
    name: "landslide"
    version: "baseline"
    checkpoint: ""

  recurvature:
    name: "recurvature"
    version: "latest"
    checkpoint: "recurvature/xgb_recurve_model.json"

  hazard_engine:
    name: "hazard_engine"
    version: "v1"

# Harmonization settings
harmonization:
  reference_frequency: "3h"
  max_interpolation_gap_hours: 12
  extrapolation_limit_hours: 6
  target_resolution_km: 10.0
  extraction_radius_km: 500.0
  grid_size: 101
  outlier_std_threshold: 4.0
  outlier_iqr_multiplier: 1.5
  min_valid_fraction: 0.5
  target_units:
    temperature: "K"
    wind_speed: "m/s"
    pressure: "Pa"
    precipitation: "mm/hr"
    humidity: "%"
    sst: "degC"

# Hazard engine weights
hazard_engine:
  weights:
    wind: 0.25
    rainfall: 0.20
    flood: 0.20
    landslide: 0.10
    storm_surge: 0.10
    ri: 0.05
    intensity: 0.10
  risk_thresholds:
    NONE: [0.0, 0.15]
    LOW: [0.15, 0.35]
    MODERATE: [0.35, 0.60]
    HIGH: [0.60, 0.80]
    EXTREME: [0.80, 1.0]

# Registry
registry_dir: "models/registry"

# Output settings
output:
  format: "json"
  save_grids: true
  grid_format: "netcdf"
  save_explanations: true