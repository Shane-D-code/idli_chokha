[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toofan"
version = "1.0.0"
description = "TOOFAN - Tropical Cyclone Forecasting and Hazard Prediction Pipeline"
readme = "README.md"
authors = [{name = "TOOFAN Team"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "networkx>=3.1",
    "joblib>=1.3.0",
    "xarray>=2023.10.0",
    "netCDF4>=1.6.0",
    "rasterio>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "shap>=0.42.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0", "torchvision>=0.15.0"]
tensorflow = ["tensorflow>=2.13.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "black>=23.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["toofan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]